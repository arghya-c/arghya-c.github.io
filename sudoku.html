<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    text-align:center;
}

h1{
    margin-bottom:10px;
}

.description{
    max-width:900px;
    margin:auto;
    margin-bottom:20px;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

#controls{
    margin:20px;
}

button,
select{
    padding:10px 16px;
    font-size:16px;
    border:none;
    border-radius:8px;
    margin:5px;
}

button{
    background:#333;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#111;
}

#status{
    min-height:28px;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

#board{
    width:540px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(9,1fr);
    background:#111;
    padding:4px;
    border-radius:12px;
    transition:0.3s;
}

#board.solved{
    background:#dff5df;
}

.cell{
    width:60px;
    height:60px;

    border:1px solid #bbb;

    box-sizing:border-box;

    text-align:center;
    font-size:28px;
    font-weight:bold;

    outline:none;

    background:white;
}

.cell.given{
    background:#e6e6e6;
    color:#111;
    cursor:pointer;
}

.cell.given.active{
    background:#dceeff;
}

.cell.rowcol{
    background:#fff7cc;
}

.cell.box{
    background:#eef6ff;
}

.cell.active{
    background:#dceeff;
}

.cell.same-number{
    background:#c8f3ff !important;
}

.cell.error{
    background:#ffebee !important;
    color:#c62828 !important;
}

.separator-right{
    border-right:5px solid #111 !important;
}

.separator-bottom{
    border-bottom:5px solid #111 !important;
}

@media(max-width:650px){

    #board{
        width:95vw;
    }

    .cell{
        width:auto;
        height:10vw;
        font-size:22px;
    }
}

</style>
</head>

<body>

<h1>Sudoku</h1>

<div class="description">

<p>
Fill every row, column and 3×3 box with digits 1–9 exactly once.
</p>

<p>
Every puzzle is randomly generated and has a unique solution.
</p>

</div>

<div id="controls">

<select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
</select>

<button id="newPuzzleBtn">
    New Puzzle
</button>

<button id="restartBtn">
    Restart Puzzle
</button>

</div>

<div id="status"></div>

<div id="board"></div>

<script>

const boardEl =
    document.getElementById(
        "board"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const difficultyEl =
    document.getElementById(
        "difficulty"
    );

const newPuzzleBtn =
    document.getElementById(
        "newPuzzleBtn"
    );

const restartBtn =
    document.getElementById(
        "restartBtn"
    );

let solutionBoard = [];

let puzzleBoard = [];

let originalPuzzle = [];

let inputs = [];

let activeCell = null;

function copyBoard(board){

    return board.map(
        row => row.slice()
    );
}

function shuffle(arr){

    const a =
        arr.slice();

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [a[i],a[j]]
            =
        [a[j],a[i]];
    }

    return a;
}

function boxIndex(r,c){

    return (
        Math.floor(r/3)*3
        +
        Math.floor(c/3)
    );
}
function createSolvedBoard(){

    const board =
        Array.from(
            {length:9},
            ()=>Array(9).fill(0)
        );

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            board[r][c]
            =
            (
                r*3
                +
                Math.floor(r/3)
                +
                c
            )%9
            +1;
        }
    }

    const digits =
        shuffle(
            [1,2,3,4,5,6,7,8,9]
        );

    const map = {};

    for(
        let i=1;
        i<=9;
        i++
    ){
        map[i] =
            digits[i-1];
    }

    const rows = [];

    for(
        const band
        of shuffle(
            [0,1,2]
        )
    ){

        rows.push(
            ...shuffle(
                [0,1,2]
            ).map(
                x => band*3+x
            )
        );
    }

    const cols = [];

    for(
        const band
        of shuffle(
            [0,1,2]
        )
    ){

        cols.push(
            ...shuffle(
                [0,1,2]
            ).map(
                x => band*3+x
            )
        );
    }

    const result =
        Array.from(
            {length:9},
            ()=>Array(9)
        );

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            result[r][c]
            =
            map[
                board[
                    rows[r]
                ][
                    cols[c]
                ]
            ];
        }
    }

    return result;
}

function popcount(x){

    let count = 0;

    while(x){

        x &= x-1;

        count++;
    }

    return count;
}

function digitsFromMask(mask){

    const result = [];

    for(
        let d=1;
        d<=9;
        d++
    ){

        if(
            mask &
            (
                1<<(d-1)
            )
        ){

            result.push(d);
        }
    }

    return result;
}

function countSolutions(
    board,
    limit=2
){

    const rowMask =
        Array(9).fill(0);

    const colMask =
        Array(9).fill(0);

    const boxMask =
        Array(9).fill(0);

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            const v =
                board[r][c];

            if(v===0)
                continue;

            const bit =
                1<<(v-1);

            rowMask[r] |= bit;
            colMask[c] |= bit;
            boxMask[
                boxIndex(r,c)
            ] |= bit;
        }
    }

    let solutions = 0;

    function dfs(){

        if(
            solutions >= limit
        ){
            return;
        }

        let bestR = -1;
        let bestC = -1;
        let bestMask = 0;
        let bestCount = 10;

        for(
            let r=0;
            r<9;
            r++
        ){

            for(
                let c=0;
                c<9;
                c++
            ){

                if(
                    board[r][c]
                    !==0
                ) continue;

                const mask =
                    511 &
                    ~(
                        rowMask[r]
                        |
                        colMask[c]
                        |
                        boxMask[
                            boxIndex(r,c)
                        ]
                    );

                const count =
                    popcount(mask);

                if(
                    count===0
                ){
                    return;
                }

                if(
                    count
                    <
                    bestCount
                ){

                    bestCount =
                        count;

                    bestR = r;
                    bestC = c;
                    bestMask =
                        mask;
                }
            }
        }

        if(
            bestR===-1
        ){

            solutions++;
            return;
        }

        const digits =
            digitsFromMask(
                bestMask
            );

        for(
            const digit
            of digits
        ){

            const bit =
                1<<(digit-1);

            board[
                bestR
            ][
                bestC
            ] = digit;

            rowMask[
                bestR
            ] |= bit;

            colMask[
                bestC
            ] |= bit;

            boxMask[
                boxIndex(
                    bestR,
                    bestC
                )
            ] |= bit;

            dfs();

            board[
                bestR
            ][
                bestC
            ] = 0;

            rowMask[
                bestR
            ] &= ~bit;

            colMask[
                bestC
            ] &= ~bit;

            boxMask[
                boxIndex(
                    bestR,
                    bestC
                )
            ] &= ~bit;
        }
    }

    dfs();

    return solutions;
}

function clueTarget(){

    const diff =
        difficultyEl.value;

    if(
        diff==="easy"
    ){
        return 44;
    }

    if(
        diff==="hard"
    ){
        return 28;
    }

    return 36;
}

function generatePuzzle(){

    statusEl.textContent =
        "Generating puzzle...";

    const solution =
        createSolvedBoard();

    const puzzle =
        copyBoard(
            solution
        );

    const cells =
        shuffle(
            [...Array(81).keys()]
        );

    let cluesLeft =
        81;

    const target =
        clueTarget();

    for(
        const idx
        of cells
    ){

        if(
            cluesLeft
            <=
            target
        ){
            break;
        }

        const r =
            Math.floor(
                idx/9
            );

        const c =
            idx%9;

        const backup =
            puzzle[r][c];

        puzzle[r][c] = 0;

        const count =
            countSolutions(
                copyBoard(
                    puzzle
                ),
                2
            );

        if(
            count===1
        ){

            cluesLeft--;

        }else{

            puzzle[r][c]
            =
            backup;
        }
    }

    solutionBoard =
        copyBoard(
            solution
        );

    puzzleBoard =
        copyBoard(
            puzzle
        );

    originalPuzzle =
        copyBoard(
            puzzle
        );
}
function renderBoard(){

    boardEl.innerHTML = "";

    inputs =
        Array.from(
            {length:9},
            ()=>Array(9)
        );

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            const cell =
                document.createElement(
                    "input"
                );

            cell.type = "text";

            cell.maxLength = 1;

            cell.className =
                "cell";

            if(
                c===2
                ||
                c===5
            ){
                cell.classList.add(
                    "separator-right"
                );
            }

            if(
                r===2
                ||
                r===5
            ){
                cell.classList.add(
                    "separator-bottom"
                );
            }

                if(puzzleBoard[r][c] !==0){

                  cell.value =
                       puzzleBoard[r][c];

                 cell.readOnly =
                      true;

                 cell.classList.add(
                      "given"
                 );

                  cell.addEventListener(
                     "click",
                     ()=>{

                            activeCell = {
                             r:r,
                              c:c
                           };

                           updateHighlights();
                        }
                   );

                }else{

                cell.addEventListener(
                    "input",
                    ()=>{

                        let value =
                            cell.value
                            .replace(
                                /[^1-9]/g,
                                ""
                            );

                        cell.value =
                            value;

                        puzzleBoard[r][c]
                        =
                        value
                        ?
                        parseInt(
                            value
                        )
                        :
                        0;

                        updateHighlights();
                        markErrors();
                        checkSolved();
                    }
                );

                cell.addEventListener(
                    "focus",
                    ()=>{

                        activeCell =
                        {
                            r:r,
                            c:c
                        };

                        updateHighlights();
                    }
                );

                cell.addEventListener(
                    "keydown",
                    e=>{

                        if(
                            e.key==="ArrowUp"
                            &&
                            r>0
                        ){

                            inputs[
                                r-1
                            ][c]
                            .focus();
                        }

                        if(
                            e.key==="ArrowDown"
                            &&
                            r<8
                        ){

                            inputs[
                                r+1
                            ][c]
                            .focus();
                        }

                        if(
                            e.key==="ArrowLeft"
                            &&
                            c>0
                        ){

                            inputs[
                                r
                            ][
                                c-1
                            ]
                            .focus();
                        }

                        if(
                            e.key==="ArrowRight"
                            &&
                            c<8
                        ){

                            inputs[
                                r
                            ][
                                c+1
                            ]
                            .focus();
                        }
                    }
                );
            }

            boardEl.appendChild(
                cell
            );

            inputs[r][c]
                =
            cell;
        }
    }

    updateHighlights();
    markErrors();
}

function clearHighlights(){

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            inputs[r][c]
                .classList
                .remove(
                    "active",
                    "rowcol",
                    "box",
                    "same-number"
                );
        }
    }
}

function updateHighlights(){

    clearHighlights();

    if(
        !activeCell
    ){
        return;
    }

    const value =
        puzzleBoard[
            activeCell.r
        ][
            activeCell.c
        ];

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            const cell =
                inputs[r][c];

            const sameRow =
                r===activeCell.r;

            const sameCol =
                c===activeCell.c;

            const sameBox =
                Math.floor(r/3)
                ===
                Math.floor(
                    activeCell.r/3
                )
                &&
                Math.floor(c/3)
                ===
                Math.floor(
                    activeCell.c/3
                );

            if(
                sameRow
                ||
                sameCol
            ){
                cell.classList.add(
                    "rowcol"
                );
            }

            if(
                sameBox
            ){
                cell.classList.add(
                    "box"
                );
            }

            if(
                r===activeCell.r
                &&
                c===activeCell.c
            ){
                cell.classList.add(
                    "active"
                );
            }

            if(
                value!==0
                &&
                puzzleBoard[r][c]
                === value
            ){

                cell.classList.add(
                    "same-number"
                );
            }
        }
    }
}

function markErrors(){

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            inputs[r][c]
                .classList
                .remove(
                    "error"
                );
        }
    }

    // rows

    for(
        let r=0;
        r<9;
        r++
    ){

        const seen = {};

        for(
            let c=0;
            c<9;
            c++
        ){

            const value =
                puzzleBoard[r][c];

            if(
                value===0
            ) continue;

            if(
                !seen[value]
            ){
                seen[value]=[];
            }

            seen[value]
            .push([r,c]);
        }

        for(
            const v
            in seen
        ){

            if(
                seen[v]
                .length>1
            ){

                for(
                    const pos
                    of seen[v]
                ){

                    inputs[
                        pos[0]
                    ][
                        pos[1]
                    ]
                    .classList
                    .add(
                        "error"
                    );
                }
            }
        }
    }

    // columns

    for(
        let c=0;
        c<9;
        c++
    ){

        const seen = {};

        for(
            let r=0;
            r<9;
            r++
        ){

            const value =
                puzzleBoard[r][c];

            if(
                value===0
            ) continue;

            if(
                !seen[value]
            ){
                seen[value]=[];
            }

            seen[value]
            .push([r,c]);
        }

        for(
            const v
            in seen
        ){

            if(
                seen[v]
                .length>1
            ){

                for(
                    const pos
                    of seen[v]
                ){

                    inputs[
                        pos[0]
                    ][
                        pos[1]
                    ]
                    .classList
                    .add(
                        "error"
                    );
                }
            }
        }
    }
        // boxes

    for(
        let br=0;
        br<3;
        br++
    ){

        for(
            let bc=0;
            bc<3;
            bc++
        ){

            const seen = {};

            for(
                let r=br*3;
                r<br*3+3;
                r++
            ){

                for(
                    let c=bc*3;
                    c<bc*3+3;
                    c++
                ){

                    const value =
                        puzzleBoard[r][c];

                    if(
                        value===0
                    ) continue;

                    if(
                        !seen[value]
                    ){
                        seen[value]=[];
                    }

                    seen[value]
                    .push([r,c]);
                }
            }

            for(
                const v
                in seen
            ){

                if(
                    seen[v]
                    .length>1
                ){

                    for(
                        const pos
                        of seen[v]
                    ){

                        inputs[
                            pos[0]
                        ][
                            pos[1]
                        ]
                        .classList
                        .add(
                            "error"
                        );
                    }
                }
            }
        }
    }
}

function checkSolved(){

    for(
        let r=0;
        r<9;
        r++
    ){

        for(
            let c=0;
            c<9;
            c++
        ){

            if(
                puzzleBoard[r][c]
                !==
                solutionBoard[r][c]
            ){

                boardEl.classList.remove(
                    "solved"
                );

                statusEl.textContent =
                    "";

                return;
            }
        }
    }

    boardEl.classList.add(
        "solved"
    );

    statusEl.textContent =
        "Solved!";
}

function restartPuzzle(){

    puzzleBoard =
        copyBoard(
            originalPuzzle
        );

    boardEl.classList.remove(
        "solved"
    );

    statusEl.textContent =
        "";

    renderBoard();
}

function buildNewPuzzle(){

    generatePuzzle();

    renderBoard();

    boardEl.classList.remove(
        "solved"
    );

    statusEl.textContent =
        "";
}

newPuzzleBtn.addEventListener(
    "click",
    buildNewPuzzle
);

restartBtn.addEventListener(
    "click",
    restartPuzzle
);

difficultyEl.addEventListener(
    "change",
    buildNewPuzzle
);

buildNewPuzzle();

</script>

</body>
</html>
